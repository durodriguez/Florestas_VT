name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Validates every row of the CSVs; fails the build on bad data, so a
      # mistyped coordinate or an unknown taxon_id never reaches the site.
      - run: npm run data
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
