name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Validates every row of the CSVs; fails the build on bad data, so a
      # mistyped coordinate or an unknown taxon_id never reaches the site.
      - run: npm run data
      # Exercises the importer against the checked-in template, so a change to
      # the schema, the mapping config or the taxa list cannot silently break
      # survey intake. --adopt-tags matches how a real field export is imported:
      # the template covers a first survey of a tagged tree, a re-survey of one
      # already on file, and an untagged tree needing a fresh accession.
      - run: npm run import -- survey/field-template.csv --adopt-tags
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
